function orderCard(o,admin=false){return `<article class="order"><div class="order-head"><b>${esc(o.id)}</b><span class="muted">${esc(o.created)} UTC</span>${admin?`<select data-status="${esc(o.id)}" aria-label="訂單狀態">${['待確認','處理中','已出貨','已完成'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select>`:`<span class="badge">${esc(o.status)}</span>`}</div><p>${o.items.map(i=>`${esc(i.name)} / ${esc(i.size)} cm × ${i.qty}　${money(i.price*i.qty)}<br><span class="muted">${esc(i.sku)}</span>`).join('<br>')}</p><p>收件人：${esc(o.customer.name)} · ${esc(o.customer.phone)}<br>${esc(o.customer.address)}${o.customer.note?'<br>備註：'+esc(o.customer.note):''}</p><p class="muted">運費 ${money(o.customer.shipping||0)} · 訂單已記錄，尚未付款</p><b>合計 ${money(o.total)}</b></article>`;}
function checkout(){if(!me)return `<section class="section"><div class="empty"><h2>登入後，完成你的訂單</h2><p class="muted">讓每筆訂單都能在會員中心找到。</p><a href="#account" class="btn">登入 / 註冊</a></div></section>`;if(!cart.length)return cartPage();let d=cartData();return `<section class="section"><div class="breadcrumb"><a href="#cart">購物袋</a> / 填寫資料 / 完成訂單</div><h1 class="page-title">把小小期待，送到你身邊。</h1><div class="cart-layout"><form class="form" id="checkoutForm"><h3>收件資訊</h3><label>收件人姓名<input name="name" autocomplete="shipping name" value="${esc(me.name)}" maxlength="100" required></label><label>聯絡電話<input name="phone" type="tel" autocomplete="shipping tel" pattern="[0-9+()\s-]{8,24}" required></label><label>配送地址<input name="address" autocomplete="shipping street-address" maxlength="500" required placeholder="縣市、行政區、街道及門牌"></label><label>訂單備註（選填）<textarea name="note" maxlength="500" placeholder="有什麼想告訴我們的嗎？"></textarea></label><label>配送方式<select name="delivery"><option>宅配</option></select></label><p class="muted">目前僅記錄訂單，不會進行任何扣款。<br>提交後可在會員中心查看訂單與處理狀態。</p><label style="display:flex;align-items:center"><input type="checkbox" required>我已確認收件資料與商品尺寸。</label><div class="error" id="formError" role="alert"></div><button class="btn" id="submitOrder">確認並建立訂單　→</button></form>${summary(d,`<div>${d.rows.map(r=>`<p><span>${esc(r.p?.name||'已下架商品')}<br><small>${esc(r.size)} cm × ${r.qty}</small></span><span>${money((r.p?.price||0)*r.qty)}</span></p>`).join('')}</div>`)}</div></section>`;}
async function admin(){if(!me)return `<section class="section"><div class="empty"><h2>商店管理</h2><p class="muted">請先以管理員帳號登入。</p><a href="#account" class="btn">前往登入</a></div></section>`;if(me.role!=='admin')return '<section class="section"><div class="empty">此頁面僅供商店管理員使用。</div></section>';let all=await api('/api/admin/products');let orders=await api('/api/orders');return `<section class="section"><span class="eyebrow">LITTLE SPROUT STUDIO</span><div class="section-heading"><h1 class="page-title">商店管理</h1><a class="text-link" href="#home">查看商店 ↗</a></div><div class="admin-tabs"><button class="chip ${adminTab==='products'?'active':''}" data-tab="products">商品 ${all.length}</button><button class="chip ${adminTab==='orders'?'active':''}" data-tab="orders">訂單 ${orders.length}</button></div>${adminTab==='products'?`<div class="section-heading"><p class="muted">管理商品內容、售價、圖片及上架狀態</p><button class="btn" id="newProduct">＋ 新增商品</button></div>${all.map(p=>`<div class="admin-row"><img src="${esc(img(p))}" alt="${esc(p.name)}"><div><b>${esc(p.name)}</b><small>${esc(p.sku)} · 庫存 ${p.stock} · ${p.active?'上架中':'已下架'}</small></div><span>${money(p.price)}</span><button class="text-link" data-edit="${esc(p.id)}">編輯</button></div>`).join('')}`:`<div class="section-heading"><p class="muted">共 ${orders.length} 筆訂單 · ${orders.filter(o=>o.status==='待確認').length} 筆待確認</p><button class="btn light" id="exportOrders">匯出 CSV</button></div>${orders.length?orders.map(o=>orderCard(o,true)).join(''):'<div class="empty">目前還沒有訂單。</div>'}`}</section>`;}
let editingImages=[],editingId=null;
async function editProduct(id){const all=await api('/api/admin/products');let p=all.find(x=>x.id===id);editingId=p?.id||null;editingImages=p?[...p.images]:[];$('#modalbody').innerHTML=`<h2>${p?'編輯商品':'新增商品'}</h2><form id="productForm" class="form"><label>商品名稱<input name="name" value="${esc(p?.name||'')}" required maxlength="200"></label><label>商品敘述<textarea name="description" maxlength="10000">${esc(p?.description||'')}</textarea></label><div class="form-grid"><label>價格 NT$<input name="price" type="number" min="0" step="1" value="${p?.price||0}" required></label><label>SKU<input name="sku" value="${esc(p?.sku||'')}" required maxlength="100"></label><label>分類<select name="category">${['上衣','下身','洋裝','外套','套裝'].map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>總庫存<input name="stock" type="number" step="1" min="0" value="${p?.stock??30}" required></label></div><label>尺寸（以逗號分隔）<input name="sizes" value="${esc(p?.sizes.join(',')||'80,90,100,110,120')}" required></label><label>商品圖片（可多選，單張 2MB，合計 8MB 內）<input type="file" id="imageFiles" multiple accept="image/png,image/jpeg,image/webp"></label><div id="imagePreview" class="image-preview"></div><div class="inline-actions"><input id="imageUrl" type="url" placeholder="或貼上 HTTPS 圖片網址" aria-label="圖片網址"><button type="button" id="addImageUrl" class="text-link">加入圖片</button></div><label style="display:flex;align-items:center"><input name="active" type="checkbox" ${!p||p.active?'checked':''}>上架商品</label><p class="muted">庫存為此商品各尺寸共用總庫存。第一張圖片為商品封面。</p><div id="productError" class="error" role="alert"></div><button class="btn">儲存商品</button></form>`;imagePreview();$('#modal').showModal();$('#imageFiles').onchange=async e=>{try{for(let f of e.target.files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2*1024*1024)throw Error('圖片需為 PNG/JPEG/WebP，單張小於 2MB');if(editingImages.length>=10)throw Error('最多 10 張圖片');let s=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});if(editingImages.join('').length+s.length>11*1024*1024)throw Error('圖片合計請小於 8MB');editingImages.push(s);}imagePreview();}catch(err){$('#productError').textContent=err.message}};$('#addImageUrl').onclick=()=>{let u=$('#imageUrl').value;if(!u.startsWith('https://')||editingImages.length>=10)return toast('請輸入 HTTPS 圖片網址，最多 10 張');editingImages.push(u);$('#imageUrl').value='';imagePreview()};$('#productForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let b=e.target.querySelector('button.btn');b.disabled=true;try{await api('/api/admin/products',{...f,id:editingId,price:Number(f.price),stock:Number(f.stock),active:!!f.active,sizes:[...new Set(f.sizes.split(/[,，]/).map(s=>s.trim()).filter(Boolean))],images:editingImages});$('#modal').close();await refresh();await render();toast('商品已儲存');}catch(err){$('#productError').textContent=err.message}finally{b.disabled=false}};}
function imagePreview(){$('#imagePreview').innerHTML=editingImages.map((s,i)=>`<div><img src="${esc(s)}" alt="商品圖片 ${i+1}"><button type="button" data-delete-image="${i}">移除 ${i===0?'（封面）':''}</button>${i?`<button type="button" data-cover="${i}">設為封面</button>`:''}</div>`).join('');$('#imagePreview').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.deleteImage!==undefined)editingImages.splice(Number(b.dataset.deleteImage),1);if(b.dataset.cover!==undefined)editingImages.unshift(editingImages.splice(Number(b.dataset.cover),1)[0]);imagePreview()};}
const infoPages={story:['關於小芽','我們相信，孩子最好的樣子，就是自在的樣子。','小芽 Little Sprout，以自然色彩與舒服剪裁，描繪童年的日常。從出門探險，到蜷在沙發上的午後，每件衣服都想陪孩子慢慢長大。','這是童裝商店開發示範，品牌、商品與服飾插畫皆為示意內容；實際布料、產地及規格需於正式上架時補齊。'],shipping:['配送與退換貨','配送方式','目前提供宅配，單筆運費 NT$80，商品滿 NT$1,500 免運。本版本僅建立訂單，尚未串接物流、金流或發票。','退換貨、出貨天數與客服聯絡方式尚待店家設定，正式開店前請補齊服務條款。'],privacy:['隱私權說明','資料如何保存','本機版本將會員、收件資訊與訂單存於本機 SQLite 資料庫，密碼以加鹽雜湊保存。購物袋保存在目前瀏覽器。','Google／LINE 授權用於識別會員身份；不同登入方式建立獨立帳戶。此版本沒有電子報或廣告追蹤。正式營運前需補充資料使用、保存期間、刪除申請及店家聯絡方式。']};
function infoPage(route){let d=infoPages[route];return `<section class="section info"><span class="eyebrow">THE LITTLE DETAILS</span><h1 class="page-title">${d[0]}</h1><h2>${d[1]}</h2><p>${d[2]}</p><p class="muted">${d[3]}</p><a href="#shop" class="text-link">探索所有商品 ↗</a></section>`;}
function guide(){return `<section class="section info"><h1 class="page-title">尺寸與購物指南</h1><p>以孩子目前身高為起點，選擇舒服的日常尺寸。</p><table><thead><tr><th>尺寸</th><th>參考身高</th><th>參考年齡</th></tr></thead><tbody>${[['80','75–85','1–2'],['90','85–95','2–3'],['100','95–105','3–4'],['110','105–115','4–5'],['120','115–125','5–6']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]} cm</td><td>${r[2]} 歲</td></tr>`).join('')}</tbody></table><p class="muted">此表為示意參考，非各款商品實際量測。孩子體型及服裝版型不同，正式上架時請補充個別商品尺寸表。</p><h2>購物流程</h2><p>挑選商品與尺寸 → 加入購物袋 → 登入會員 → 填寫收件資料 → 確認建立訂單。<br>目前僅記錄訂單，無線上付款。</p></section>`;}
let renderId=0;
async function render(){const current=++renderId;let route=decodeURIComponent(location.hash.slice(1)||'home'),[page,id]=route.split('/');try{let html;if(['account','register','checkout','admin','success'].includes(page))html=`<section class="section"><div class="empty"><div class="symbol">♧</div><span class="eyebrow">LITTLE SPROUT PREVIEW</span><h1 class="page-title">小芽，準備與你見面。</h1><p class="muted">目前為外觀展示版，可以瀏覽商品、選擇尺寸與體驗購物袋。<br>會員登入、註冊與訂單功能尚未開放。</p><a class="btn" href="#shop">繼續探索商品　↗</a></div></section>`;else if(page==='home')html=home();else if(page==='shop'){filter=id||'';html=shop()}else if(page==='product')html=detail(id);else if(page==='cart')html=cartPage();else if(page==='checkout')html=checkout();else if(page==='register'){register=true;html=me?await account():authPage();}else if(page==='account'){register=false;html=await account();}else if(page==='admin')html=await admin();else if(page==='success')html=`<section class="section success"><div class="symbol">♧</div><span class="eyebrow">A LITTLE JOY IS ON ITS WAY</span><h1 class="page-title">已收到你的訂單</h1><p>訂單編號：${esc(id)}</p><p class="muted">資料已存入資料庫，尚未收款。<br>你可以在會員中心查看訂單狀態。</p><a class="btn" href="#account">查看我的訂單</a> <a href="#shop" class="btn light">繼續逛逛</a></section>`;else if(page==='guide')html=guide();else if(infoPages[page])html=infoPage(page);else html='<div class="empty">找不到此頁面。<a href="#home">返回首頁</a></div>';if(current!==renderId)return;app.innerHTML=html;bind(page,id);}catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
function bind(page,id){
 app.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>location.hash='product/'+b.dataset.product);
 if(page==='shop'){ $('#sort').onchange=e=>{sort=e.target.value;render()};if($('#clearSearch'))$('#clearSearch').onclick=()=>{term='';render()};}
 if(page==='product'&&$('#addCart')){app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=b.dataset.size;app.querySelectorAll('.size').forEach(x=>x.classList.toggle('active',x===b))});$('#minus').onclick=()=>$('#quantity').textContent=selectedQty=Math.max(1,selectedQty-1);$('#plus').onclick=()=>$('#quantity').textContent=selectedQty=Math.min(99,selectedQty+1);$('#addCart').onclick=()=>addCart(id);app.querySelectorAll('[data-thumb]').forEach(b=>b.onclick=()=>$('#mainPhoto').src=products.find(p=>p.id===id).images[Number(b.dataset.thumb)]);}
 if(page==='cart'){app.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{let r=cart[Number(b.dataset.cart)],q=r.qty+Number(b.dataset.delta),p=products.find(p=>p.id===r.id);if(q<1)return;if(q>99||cart.filter(x=>x.id===r.id).reduce((a,x)=>a+x.qty,0)+Number(b.dataset.delta)>(p?.stock||0))return toast('商品庫存不足');r.qty=q;checkoutKey=crypto.randomUUID();saveCart();render()});app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);checkoutKey=crypto.randomUUID();saveCart();render()});}
 if($('#switchAuth'))$('#switchAuth').onclick=()=>{location.hash=register?'account':'register'};app.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>location.href='/auth/'+b.dataset.auth);
 if($('#authForm'))$('#authForm').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('.btn');b.disabled=true;try{let values=Object.fromEntries(new FormData(e.target));if(register&&values.password!==values.confirmPassword)throw Error('兩次密碼不一致，請重新確認');await api(register?'/api/register':'/api/login',values);await refresh();toast(register?'註冊成功，歡迎加入小芽 ♧':'登入成功');if(cart.length)location.hash='checkout';else if(location.hash==='#account')await render();else location.hash='account';}catch(err){$('#formError').textContent=err.message}finally{b.disabled=false}};
 if($('#logout'))$('#logout').onclick=async()=>{await api('/api/logout',{});await refresh();await render()};
 if($('#checkoutForm'))$('#checkoutForm').onsubmit=async e=>{e.preventDefault();$('#submitOrder').disabled=true;try{let result=await api('/api/orders',{items:cart,customer:Object.fromEntries(new FormData(e.target)),key:checkoutKey});cart=[];saveCart();checkoutKey=crypto.randomUUID();await refresh();location.hash='success/'+result.id;}catch(err){$('#formError').textContent=err.message;$('#submitOrder').disabled=false}};
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;render()});if($('#newProduct'))$('#newProduct').onclick=()=>editProduct(null);app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));app.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{try{await api('/api/admin/order-status',{id:s.dataset.status,status:s.value});toast('訂單狀態已更新')}catch(err){toast(err.message);render()}});
 if($('#exportOrders'))$('#exportOrders').onclick=async()=>{let orders=await api('/api/orders'),rows=[['訂單編號','時間 UTC','狀態','收件人','電話','地址','總金額','商品 SKU / 尺寸 / 數量']];for(let o of orders)rows.push([o.id,o.created,o.status,o.customer.name,o.customer.phone,o.customer.address,o.total,o.items.map(i=>`${i.sku} / ${i.size} / ${i.qty}`).join('; ')]);let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='little-sprout-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
}
$('#searchToggle').onclick=()=>{$('#searchbar').hidden=!$('#searchbar').hidden;if(!$('#searchbar').hidden)$('#search').focus()};function doSearch(){term=$('#search').value.trim();filter='';if(location.hash==='#shop')render();else location.hash='shop';$('#searchbar').hidden=true;}$('#searchGo').onclick=doSearch;$('#search').onkeydown=e=>{if(e.key==='Enter')doSearch()};$('#modal .close').onclick=()=>$('#modal').close();window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
(async()=>{try{await refresh();await render();let error=new URLSearchParams(location.search).get('auth_error');if(error){toast(error);history.replaceState(null,'',location.pathname+location.hash)}}catch(e){app.innerHTML='<div class="empty">商品暫時無法載入，請稍後重新整理。</div>'}})();
</script></body></html>
